<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClearLock Options</title>
  <style>
    :root {
      /* Light Mode Palette */
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --border-focus: #111827;
      --btn-bg: #111827;
      --btn-text: #ffffff;
      --btn-hover: #374151;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        /* Dark Mode Palette */
        --bg-color: #0f0f11;
        --card-bg: #17171a;
        --text-main: #f3f4f6;
        --text-muted: #9ca3af;
        --border-color: #374151;
        --border-focus: #f3f4f6;
        --btn-bg: #f3f4f6;
        --btn-text: #111827;
        --btn-hover: #d1d5db;
      }
    }

    /* Extension popups act as the 'body', so we set dimensions here */
    body {
      width: 320px;
      margin: 0;
      padding: 24px;
      background-color: var(--card-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .icon {
      width: 24px;
      height: 24px;
      color: var(--text-main);
    }

    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Premium Input Styling */
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 12px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus {
      border-color: var(--border-focus);
    }

    input::placeholder {
      color: var(--border-color);
      font-weight: 400;
      letter-spacing: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background: var(--btn-hover);
    }
  </style>
</head>
<body>

  <div class="header">
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
    </svg>
    <h3>ClearLock</h3>
  </div>

  <div class="form-group">
    <label for="pinInput">Set PIN for current domain</label>
    <input type="password" id="pinInput" placeholder="••••" maxlength="4" autocomplete="off" autofocus>
  </div>
  
  <button id="lockBtn">Lock This Site</button>

  <!-- Notice we removed the status div, because our new instant-redirect JS closes the popup immediately upon success -->

  <script src="popup.js"></script>
</body>
</html>
